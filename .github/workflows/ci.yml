name: "Burn Bot"

on:
  push:
    tags:
      - '*'
    branches:
      - '*'
  pull_request:


jobs:
  build:
    name: "Build (no push)"
    uses: docker/github-builder/.github/workflows/build.yml@v1.18.1
    permissions:
      contents: read
      id-token: write
    with:
      context: .
      file: ./Dockerfile
      output: image
      push: false
      platforms: linux/amd64,linux/arm64
      distribute: true
      fail-fast: true
      meta-images: ghcr.io/croydon/matrix-burn-bot-rs
      meta-tags: |
        type=raw,value=ci-test

  build_and_deploy_dev:
    name: "Build and Deploy (:dev)"
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    uses: docker/github-builder/.github/workflows/build.yml@v1.18.1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: .
      file: ./Dockerfile
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      distribute: true
      fail-fast: true
      meta-images: ghcr.io/croydon/matrix-burn-bot-rs
      meta-tags: |
        type=raw,value=dev
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build_and_deploy_release:
    name: "Build and Deploy (release)"
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    uses: docker/github-builder/.github/workflows/build.yml@v1.18.1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      context: .
      file: ./Dockerfile
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      distribute: true
      fail-fast: true
      meta-images: ghcr.io/croydon/matrix-burn-bot-rs
      meta-tags: |
        type=ref,event=tag
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
