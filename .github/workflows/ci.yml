name: "Test Burn Bot"

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: croydon/matrix-burn-bot-rs

jobs:
  tests:
    name: Build Burn Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Build
        run: |
          cargo build --release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: "Docker: Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Docker: Build (no push)"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev

  build_and_deploy:
    name: "Build and Deploy"
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write  # Docs
      packages: write  # Container push

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Build
        run: |
          cargo build --release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: "Docker: Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Docker: Log in to GHCR"
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Docker: Extract metadata (tags, labels)"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: "Docker: Build & Push (:dev)"
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          labels: ${{ steps.meta.outputs.labels }}

      - name: "Docker: Build & Push"
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
