[package]
name = "matrix-burn-bot"
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["Michael Keck <git@cr0ydon.com>"]

[[bin]]
name = "matrix-burn-bot"

[dependencies]
matrix-sdk = ">=0.19.1, <1.0.0"
toml = ">=1.1.8, <2.0.0"
anyhow = ">=1.0.102, <2.0.0"
rand = ">=0.10.0, <1.0.0"
serde = ">= 1.0.228, <2.0.0"
tokio = { version = ">= 1.51.0, <2.0.0", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = "<= 0.3.23, <1.0.0"
futures-util = ">= 0.3.32, <1.0.0"
